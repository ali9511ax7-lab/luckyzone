
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LuckyZone - Play for Fun</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#090909;
 color:white;
 font-family:Arial,sans-serif;
 text-align:center;
}
header{
 padding:25px;
 border-bottom:1px solid #b99743;
 color:#e5bd58;
 font-size:28px;
 font-weight:bold;
}
.hero{padding:55px 20px}
h1{font-size:38px;color:#e5bd58}
p{color:#aaa;line-height:1.6}
.balance{
 background:#171717;
 border:1px solid #b99743;
 border-radius:15px;
 padding:20px;
 margin:20px auto;
 max-width:350px;
}
.coins{font-size:30px;color:#e5bd58}
button{
 background:#c49b3b;
 color:#111;
 border:0;
 padding:15px 25px;
 border-radius:9px;
 font-size:17px;
 font-weight:bold;
 margin:8px;
 cursor:pointer;
}
.game{
 background:#171717;
 border:1px solid #444;
 border-radius:15px;
 padding:25px;
 margin:20px auto;
 max-width:400px;
}
.slots{font-size:45px;margin:25px}
footer{padding:30px;color:#777;font-size:13px}
</style>
</head>
<body>

<header>♛ LuckyZone</header>

<section class="hero">
<h1>WELCOME TO LUCKYZONE</h1>
<p>Play exciting casino-style games.<br>
Enjoy the fun with virtual coins!</p>

<div class="balance">
<p>Your Virtual Balance</p>
<div class="coins">🪙 <span id="coins">1000</span></div>
<button onclick="bonus()">Daily Bonus +100</button>
</div>

<div class="game">
<h2>🎰 Lucky Slots</h2>
<div class="slots" id="slots">🍒 🍋 🍇</div>
<button onclick="spin()">SPIN</button>
<p id="message">Try your luck!</p>
</div>
</section>

<footer>
LuckyZone © 2026<br>
Virtual coins have no cash value.
For entertainment only.
</footer>

<script>
let coins=1000;
let bonusClaimed=false;

function update(){
 document.getElementById("coins").textContent=coins;
}

function bonus(){
 if(bonusClaimed){
  alert("You already claimed your daily bonus!");
  return;
 }
 coins+=100;
 bonusClaimed=true;
 update();
 document.getElementById("message").textContent="Daily bonus claimed!";
}

function spin(){
 if(coins<10){
  document.getElementById("message").textContent="Not enough coins!";
  return;
 }
 coins-=10;
 let symbols=["🍒","🍋","🍇","💎","⭐"];
 let a=symbols[Math.floor(Math.random()*symbols.length)];
 let b=symbols[Math.floor(Math.random()*symbols.length)];
 let c=symbols[Math.floor(Math.random()*symbols.length)];
 document.getElementById("slots").textContent=a+" "+b+" "+c;

 if(a===b && b===c){
  coins+=100;
  document.getElementById("message").textContent="JACKPOT! +100 coins!";
 }else{
  document.getElementById("message").textContent="Try again!";
 }
 update();
}
</script>

</body>
</html>
